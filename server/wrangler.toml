# Настройки сервера AVA TRADE для Cloudflare Workers.
# Секреты (токен бота и т.д.) сюда НЕ пишутся — они задаются
# в панели Cloudflare: Settings → Variables and Secrets.

name = "ava-trade-verify"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
# Адрес вашего сайта (без слэша в конце). Можно несколько через запятую.
ALLOWED_ORIGIN = "https://vadim626.github.io"

[[kv_namespaces]]
binding = "AVA_KV"
# Замените на ID вашего KV-хранилища из панели Cloudflare.
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
