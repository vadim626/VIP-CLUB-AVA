# Настройки сервера AVA TRADE для Cloudflare Workers.
# Cloudflare сам берёт код из GitHub (ветка feature/id-verification, папка server).
#
# Секреты (BOT_TOKEN, WEBHOOK_SECRET, ADMIN_CHAT_ID, CHANNEL_ID) сюда НЕ пишутся —
# они задаются в панели Cloudflare: Settings → Variables and Secrets (тип Secret).

name = "blue-moon-2662ava-trade-verify"
main = "worker.js"

# Сам сайт тоже открывается с этого адреса (папку public собирает GitHub Actions из index.html)
[assets]
directory = "./public"
compatibility_date = "2026-11-01"

[vars]
# Адрес вашего сайта (без слэша в конце). Можно несколько через запятую.
ALLOWED_ORIGIN = "https://vip-club-ava.vercel.app,https://vip-club-ava-*.vercel.app,https://blue-moon-2662ava-trade-verify.prohavadim9.workers.dev"

# Хранилище заявок и настроек
[[kv_namespaces]]
binding = "AVA_KV"
id = "d89a8c0bd57d46f1aad2e3ec136f176f"
